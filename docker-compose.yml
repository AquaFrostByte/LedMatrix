services:
  ledmatrix:
    image: ghcr.io/aquafrostbyte/ledmatrix-server:latest
    restart: unless-stopped
    ports:
      - 8086:8000
    environment:
      MQTT_HOST: 192.168.2.22
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      BASE_TOPIC: ledmatrix
      UI_USER: ${UI_USER:-}
      UI_PASS: ${UI_PASS:-}
    volumes:
      - ./data:/data