services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - 1883:1883
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    command: >
      sh -c "rm -f /mosquitto/config/passwd && mosquitto_passwd -b -c
      /mosquitto/config/passwd '${MQTT_USER}' '${MQTT_PASS}' && chown
      mosquitto:mosquitto /mosquitto/config/passwd && chmod 600
      /mosquitto/config/passwd && exec mosquitto -c
      /mosquitto/config/mosquitto.conf"
    volumes:
      - mosquitto-data:/mosquitto/data
  ledmatrix:
    image: ghcr.io/aquafrostbyte/ledmatrix-server:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - 8086:8000
    environment:
      MQTT_HOST: mosquitto
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      BASE_TOPIC: ledmatrix
      UI_USER: ${UI_USER:-}
      UI_PASS: ${UI_PASS:-}
    volumes:
      - ./data:/data
configs:
  mosquitto_conf:
    content: |
      listener 1883
      allow_anonymous false
      password_file /mosquitto/config/passwd
      persistence true
      persistence_location /mosquitto/data/
volumes:
  mosquitto-data: null
networks: {}
